gui:
  mouseEvents: true
  expandFocusedSidePanel: false
  mainPanelSplitMode: flexable
  sidePanelWidth: 0.3333
  scrollPastBottom: true
git:
  diffRenderers:
    - useConfig: false
      command: delta --dark --paging=never
      colorArg: always
notARepository: quit
disableStartupPopups: false
promptToReturnFromSubprocess: false
colorScheme: auto
lightTheme:
  activeBorderColor:
    - '#8839ef'
    - bold
  inactiveBorderColor:
    - '#6c6f85'
  searchingActiveBorderColor:
    - '#df8e1d'
  optionsTextColor:
    - '#1e66f5'
  selectedLineBgColor:
    - '#ccd0da'
  inactiveViewSelectedLineBgColor:
    - '#9ca0b0'
  cherryPickedCommitFgColor:
    - '#8839ef'
  cherryPickedCommitBgColor:
    - '#bcc0cc'
  markedBaseCommitFgColor:
    - '#1e66f5'
  markedBaseCommitBgColor:
    - '#df8e1d'
  unstagedChangesColor:
    - '#d20f39'
  defaultFgColor:
    - '#4c4f69'
  authorColors:
    '*': '#7287fd'
darkTheme:
  activeBorderColor:
    - "#cba6f7"
    - bold
  inactiveBorderColor:
    - "#a6adc8"
  searchingActiveBorderColor:
    - "#f9e2af"
  optionsTextColor:
    - "#89b4fa"
  selectedLineBgColor:
    - "#313244"
  inactiveViewSelectedLineBgColor:
    - "#6c7086"
  cherryPickedCommitFgColor:
    - "#cba6f7"
  cherryPickedCommitBgColor:
    - "#45475a"
  markedBaseCommitFgColor:
    - "#89b4fa"
  markedBaseCommitBgColor:
    - "#f9e2af"
  unstagedChangesColor:
    - "#f38ba8"
  defaultFgColor:
    - "#cdd6f4"
  authorColors:
    "*": "#b4befe"
