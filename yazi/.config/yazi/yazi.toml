# Main Yazi configuration
# Your existing theme.toml is loaded automatically.

[mgr]
# Width of the parent, current directory, and preview panes.
ratio = [1, 4, 3]

sort_by = "natural"       # file2 comes before file10
sort_sensitive = false    # Case-insensitive sorting
sort_reverse = false
sort_dir_first = true

show_hidden = true
show_symlink = true
scrolloff = 5             # Keep context around the cursor
linemode = "size"         # Show file sizes on the right

[preview]
wrap = "no"               # Toggle line wrapping with your keymap if desired
tab_size = 4
max_width = 1000
max_height = 1000
image_filter = "lanczos3"
image_quality = 75
